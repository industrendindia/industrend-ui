server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
spring:
  application:
    name: customer-platform-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/industrend}
    username: ${DATABASE_USER:industrend}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-init-sql: SET search_path TO industrendindia,pg_catalog
  flyway:
    enabled: true
    default-schema: industrendindia
    schemas: industrendindia
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    otp-pepper: ${OTP_PEPPER:change-me-before-production}
    cookie-secure: ${COOKIE_SECURE:true}
    expose-mock-otp: ${EXPOSE_MOCK_OTP:false}
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}